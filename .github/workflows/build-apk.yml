name: Build Cafeteria APK & Publish Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Gradle project root
        id: locate
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ لم يتم العثور على ملفات مشروع الأندرويد (settings.gradle.kts) داخل المستودع! تأكد من الضغط على Push to GitHub من AI Studio."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project in: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK for Release
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/Cafeteria-POS.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cafeteria-POS-APK
          path: Cafeteria-POS.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Cafeteria POS (كافتيريا)"
          body: "أحدث نسخة جاهزة للتثبيت من تطبيق كافتيريا."
          files: Cafeteria-POS.apk
          overwrite_files: true
