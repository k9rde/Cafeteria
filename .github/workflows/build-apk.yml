name: Build Cafeteria APK & Publish Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK and Update Metadata for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Cafeteria-POS.apk
          VERSION_CODE=$(grep -E "versionCode\s*=" app/build/gradle.kts | head -n1 | sed -E 's/[^0-9]//g')
          VERSION_NAME=$(grep -E "versionName\s*=" app/build/gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -f docs/version.json ] && grep -q "\"versionCode\"[[:space:]]*:[[:space:]]*${VERSION_CODE}" docs/version.json; then
            cp docs/version.json version.json
          else
            cat <<EOF > version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/k9rde/Cafeteria/releases/download/latest/Cafeteria-POS.apk",
            "releaseNotes": "تحديث جديد لتطبيق قصة كافيه يتضمن تحسينات في الأداء والسلاسة وإصلاحات مهمة دون حذف أي بيانات."
          }
          EOF
          fi

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Cafeteria POS (كافتيريا)"
          body: "أحدث نسخة جاهزة للتثبيت والتحديث المباشر من تطبيق كافتيريا."
          files: |
            Cafeteria-POS.apk
            version.json
          overwrite_files: true
